name: ubuntu-iso-builder

services:
  builder:
    image: ghcr.io/wrrm/ubuntu-builder:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    environment:
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-17179869184}
    volumes:
      - builder_data:/data
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  builder_data:
